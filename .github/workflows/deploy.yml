name: Fetch Podcast Digest and Deploy to Pages

on:
  schedule:
    - cron: '0 8 * * *' # 每天早上 8 點 (UTC)
  workflow_dispatch: # 允許手動觸發

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 確保安裝系統套件 yt-dlp 需要的 ffmpeg (處理音訊)
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Python script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 如果因為某種原因沒有 data 資料夾，先建立它
          mkdir -p data
          # 執行抓取與分析腳本 (注意：目前寫死測試 Video ID，未來可由其他清單讀取)
          python src/sample_fallback.py
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Frontend
        working-directory: ./web
        run: |
          npm install
          mkdir -p public
          cp ../data/history.json public/data.json || echo "[]" > public/data.json
          npm run build

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
